[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safebrowse-client"
version = "0.1.2"
description = "Thin Python client for the SafeBrowse localhost daemon"
readme = "README.md"
license = "LicenseRef-SafeBrowse-NC-1.0"
requires-python = ">=3.12"
authors = [{ name = "RobKang1234" }]
maintainers = [{ name = "RobKang1234" }]
keywords = ["agent-security", "browser-agents", "middleware", "python-client", "safebrowse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RobKang1234/safebrowse-sdk#readme"
Documentation = "https://github.com/RobKang1234/safebrowse-sdk#readme"
Repository = "https://github.com/RobKang1234/safebrowse-sdk"
Issues = "https://github.com/RobKang1234/safebrowse-sdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

