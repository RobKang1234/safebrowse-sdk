name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  nightly-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Optional BrowserGym / AgentDojo hooks
        run: |
          echo "BrowserGym runner: ${BROWSERGYM_RUNNER:-disabled}"
          echo "AgentDojo runner: ${AGENTDOJO_RUNNER:-disabled}"
      - run: pnpm run kb:bundle -- --generate-dev-key
      - run: pnpm kb:verify
