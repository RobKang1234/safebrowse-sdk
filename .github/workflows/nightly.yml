name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  nightly-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-python-module.mjs -m pip install build twine
      - run: pnpm build
      - run: pnpm test
      - run: pnpm perf:daemon:gate -- --json-out perf-daemon-routes.json
      - name: Optional BrowserGym / AgentDojo hooks
        run: |
          echo "BrowserGym runner: ${BROWSERGYM_RUNNER:-disabled}"
          echo "AgentDojo runner: ${AGENTDOJO_RUNNER:-disabled}"
      - run: pnpm run kb:bundle -- --generate-dev-key
      - run: pnpm kb:verify
      - run: pnpm release:build:python
      - run: pnpm release:check:python
      - run: pnpm release:audit
      - run: pnpm auditor:parity
      - run: pnpm auditor:review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daemon-perf-nightly
          path: perf-daemon-routes.json
