name: release-readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - ".github/workflows/publish-pypi.yml"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"
      - "python/**"
      - "scripts/automation/**"
      - "scripts/ci/**"
      - "scripts/release/**"
      - "knowledge_base/**"
  push:
    paths:
      - ".github/workflows/release*.yml"
      - ".github/workflows/publish-pypi.yml"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"
      - "python/**"
      - "scripts/automation/**"
      - "scripts/ci/**"
      - "scripts/release/**"
      - "knowledge_base/**"

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: npm install -g npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-python-module.mjs -m pip install build twine
      - run: pnpm release:ready
