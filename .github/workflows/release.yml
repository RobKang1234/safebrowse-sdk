name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run kb:bundle -- --generate-dev-key
      - run: node scripts/run-python-module.mjs -m pip install build
      - run: node scripts/run-python-module.mjs -m build python/safebrowse_client -o python/dist
      - uses: actions/upload-artifact@v4
        with:
          name: safebrowse-artifacts
          path: |
            packages/*/dist
            python/dist
            knowledge_base/safebrowse_vf_knowledge_bases.zip
            knowledge_base/safebrowse_vf_knowledge_bases.zip.sig
            knowledge_base/safebrowse_vf_knowledge_base_index.json.sig
            knowledge_base/signing/safebrowse_vf_ed25519_public.pem
