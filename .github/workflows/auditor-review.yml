name: auditor-review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditor-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-python-module.mjs -m pip install build twine
      - run: pnpm auditor:review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auditor-review-latest
          path: |
            demo-output/latest/**
            demo-output/latest-auditor-suite/**
